<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <title>Web Client - Reliable UDP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-dark text-light p-5">
    <div class="container" style="max-width: 600px;">
        <h2 class="mb-4">Reliable File Downloader</h2>

        <div class="input-group mb-3">
            <span class="input-group-text bg-secondary text-light">Server IP</span>
            <input type="text" id="server-ip" class="form-control" placeholder="e.g., 192.168.1.50" value="127.0.0.1">
        </div>

        <div class="input-group mb-4">
            <span class="input-group-text bg-secondary text-light">Filename</span>
            <input type="text" id="filename" class="form-control" placeholder="e.g., file2.pdf">
            <button id="btn-download" class="btn btn-primary" onclick="startDownload()">Download</button>
        </div>

        <div class="card bg-secondary mb-3">
            <div class="card-body">
                <h5 class="card-title" id="status-text">Idle</h5>
                <p class="card-text text-info" id="message-text">Waiting to start...</p>

                <div class="progress mb-3" style="height: 25px;">
                    <div id="progress-bar" class="progress-bar progress-bar-striped progress-bar-animated bg-success"
                        role="progressbar" style="width: 0%;">0%</div>
                </div>

                <div class="d-flex justify-content-between">
                    <span id="speed-text">Speed: 0.00 MB/s</span>
                    <span id="bytes-text">0 / 0 bytes</span>
                </div>

                <div id="hash-info" class="mt-3 p-2 bg-dark rounded d-none"
                    style="font-family: monospace; font-size: 0.85em; word-break: break-all;">
                    <div class="text-secondary">Expected SHA-256 (Server): <br><span id="server-hash"
                            class="text-light">...</span></div>
                    <div class="text-secondary mt-2">Calculated SHA-256 (Client): <br><span id="client-hash"
                            class="text-light">...</span></div>
                </div>
            </div>
        </div>

        <div class="d-flex gap-2">
            <button id="btn-pause" class="btn btn-warning w-50" onclick="pause()" disabled>Pause</button>
            <button id="btn-resume" class="btn btn-success w-50" onclick="resume()" disabled>Resume</button>
        </div>
    </div>

    <script>
        // Start downloading
        function startDownload() {
            const filename = document.getElementById('filename').value;
            const ip = document.getElementById('server-ip').value;

            if (!filename || !ip) {
                alert("Please enter both a Server IP and a Filename.");
                return;
            }

            // Hide previous hash info if starting a new download
            document.getElementById('hash-info').classList.add('d-none');

            fetch('/start', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ filename: filename, ip: ip })
            });

            document.getElementById('btn-pause').disabled = false;
        }

        // Pause / Resume functions
        function pause() { fetch('/pause', { method: 'POST' }); }
        function resume() { fetch('/resume', { method: 'POST' }); }

        // Poll the server every 500ms to update the UI
        setInterval(() => {
            fetch('/status')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('progress-bar').style.width = data.progress + '%';
                    document.getElementById('progress-bar').innerText = data.progress + '%';
                    document.getElementById('speed-text').innerText = `Speed: ${data.speed.toFixed(2)} MB/s`;
                    document.getElementById('bytes-text').innerText = `${data.completed_bytes} / ${data.total_bytes} bytes`;
                    document.getElementById('status-text').innerText = `Status: ${data.status.toUpperCase()}`;
                    document.getElementById('message-text').innerText = data.message;

                    // Toggle button states based on status
                    if (data.status === 'downloading') {
                        document.getElementById('btn-pause').disabled = false;
                        document.getElementById('btn-resume').disabled = true;
                        document.getElementById('hash-info').classList.add('d-none');
                    } else if (data.status === 'paused') {
                        document.getElementById('btn-pause').disabled = true;
                        document.getElementById('btn-resume').disabled = false;
                    } else if (data.status === 'finished' || data.status === 'error') {
                        document.getElementById('btn-pause').disabled = true;
                        document.getElementById('btn-resume').disabled = true;

                        // Reveal and populate hashes when finished
                        if (data.server_hash || data.client_hash) {
                            document.getElementById('server-hash').innerText = data.server_hash;
                            document.getElementById('client-hash').innerText = data.client_hash;
                            document.getElementById('hash-info').classList.remove('d-none');

                            // Color-code the client hash based on match
                            if (data.status === 'finished') {
                                document.getElementById('client-hash').className = 'text-success';
                            } else {
                                document.getElementById('client-hash').className = 'text-danger';
                            }
                        }
                    }
                });
        }, 500);
    </script>
</body>

</html>
